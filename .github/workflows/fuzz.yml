name: Fuzz smoke test

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [packet, ipv6_ndp, discovery_protocols, snmp_ber, pcap_stream]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build ${{ matrix.target }}
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=5
